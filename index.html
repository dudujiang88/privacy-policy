<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171a17" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="index,follow">
  <title>隐私政策 · 嘟哒笔记</title>
  <meta name="description" content="嘟哒笔记隐私政策：说明笔记、附件、提醒和桌面小组件如何在设备本地处理。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="隐私政策 · 嘟哒笔记">
  <meta property="og:description" content="说明嘟哒笔记如何在设备本地保存和处理数据。">
  <style>
    :root {
      --paper: #f7f3ea;
      --paper-deep: #eee8dc;
      --ink: #252823;
      --muted: #666a62;
      --line: rgba(59, 64, 55, .15);
      --accent: #57705c;
      --accent-soft: rgba(87, 112, 92, .11);
      --card: rgba(255, 255, 255, .58);
      --shadow: 0 24px 70px rgba(67, 62, 49, .09);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--paper);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(178, 193, 170, .25), transparent 30rem),
        linear-gradient(135deg, var(--paper), var(--paper-deep));
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "PingFang SC", "Noto Sans CJK SC", "Segoe UI", sans-serif;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      width: min(100% - 32px, 980px);
      margin: 0 auto;
      padding: 28px 0 max(72px, env(safe-area-inset-bottom));
    }

    .skip-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 9px 13px;
      color: white;
      border-radius: 10px;
      background: var(--accent);
      text-decoration: none;
      transform: translateY(-150%);
      transition: transform .2s ease;
    }

    .skip-link:focus { transform: translateY(0); }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 36px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 650;
      letter-spacing: -.02em;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      color: white;
      border-radius: 11px;
      background: var(--accent);
      box-shadow: 0 8px 22px rgba(87, 112, 92, .24);
    }

    .mark::before {
      content: "";
      width: 16px;
      height: 19px;
      border-radius: 2px;
      background:
        linear-gradient(white, white) 4px 5px / 8px 1px no-repeat,
        linear-gradient(white, white) 4px 9px / 8px 1px no-repeat,
        linear-gradient(white, white) 4px 13px / 5px 1px no-repeat;
      border: 1px solid rgba(255,255,255,.85);
    }

    .language-picker {
      display: flex;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.45);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    .language-picker button {
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--muted);
      background: transparent;
      font: 600 13px/1 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, box-shadow .2s ease;
    }

    .language-picker button:hover { color: var(--ink); }

    .language-picker button[aria-pressed="true"] {
      color: white;
      background: var(--accent);
      box-shadow: 0 3px 10px rgba(87, 112, 92, .2);
    }

    .hero {
      padding: 16px 0 42px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font: 700 12px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 720px;
      margin: 0;
      font-size: clamp(38px, 7vw, 64px);
      font-weight: 650;
      line-height: 1.08;
      letter-spacing: -.045em;
      text-wrap: balance;
    }

    .lede {
      max-width: 650px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.75;
    }

    .date {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      padding: 8px 12px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      font: 600 12px/1.2 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .date::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 70px;
      padding-top: 48px;
    }

    .toc {
      position: sticky;
      top: 24px;
      align-self: start;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    .toc-title {
      margin: 0 0 12px;
      color: var(--muted);
      font: 700 11px/1.2 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .toc a {
      display: block;
      padding: 6px 0;
      color: var(--muted);
      font: 500 13px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-decoration: none;
    }

    .toc a:hover { color: var(--accent); }

    article { min-width: 0; }

    article section {
      scroll-margin-top: 28px;
      padding-bottom: 40px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: clamp(23px, 3vw, 30px);
      font-weight: 550;
      line-height: 1.3;
      letter-spacing: -.025em;
    }

    p { margin: 0 0 14px; }

    ul {
      margin: 10px 0 0;
      padding-left: 1.35em;
    }

    li { margin: 7px 0; }

    .promise {
      margin-bottom: 40px;
      padding: 24px 26px;
      border: 1px solid rgba(87, 112, 92, .2);
      border-radius: 20px;
      background: var(--accent-soft);
    }

    .promise strong {
      display: block;
      margin-bottom: 5px;
      color: var(--accent);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    footer {
      margin-top: 24px;
      padding-top: 28px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font: 13px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    [data-lang-panel] { animation: reveal .32s ease both; }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    :focus-visible {
      outline: 3px solid rgba(87, 112, 92, .4);
      outline-offset: 3px;
    }

    @media (max-width: 760px) {
      .shell { width: min(100% - 24px, 640px); padding-top: 18px; }
      .topbar { margin-bottom: 26px; }
      .brand-text { display: none; }
      .language-picker button { padding: 8px 10px; }
      .hero { padding-bottom: 32px; }
      .layout { display: block; padding-top: 34px; }
      .toc { display: none; }
      .promise { margin-bottom: 32px; padding: 20px; }
      article section { padding-bottom: 32px; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #171a17;
        --paper-deep: #20231f;
        --ink: #ecebe4;
        --muted: #acafa6;
        --line: rgba(236, 235, 228, .12);
        --accent: #9ab59e;
        --accent-soft: rgba(154, 181, 158, .1);
        --card: rgba(36, 40, 35, .68);
        --shadow: 0 24px 70px rgba(0, 0, 0, .2);
      }
      .language-picker { background: rgba(36, 40, 35, .6); }
      .language-picker button[aria-pressed="true"] { color: #152017; background: var(--accent); }
      .mark { color: #18201a; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; }
    }
  </style>
</head>

          ["widget", "4. Home-screen widget", ["The widget reads recent note titles, excerpts, update times, and reminder status on the device so it can display them. Whether content is hidden while the device is locked depends on system settings."]],
          ["deletion", "5. Retention and deletion", ["Notes moved to Trash can still be restored. Permanently deleting a note or emptying Trash also deletes its attachments and version history. The app keeps up to 40 versions per note and removes older versions automatically.", "When you uninstall the app, iOS removes its local data. Data in device backups is managed by your system backup settings."]],
          ["collection", "6. Collection and tracking", ["The app has no accounts, developer server, advertising, or third-party analytics. It does not collect, sell, or use your data for tracking."]],
          ["changes", "7. Policy updates", ["If cloud sync or another data feature is added later, this page and its update date will be revised."]],
          ["contact", "8. Contact", ["If you have questions about this Privacy Policy, use the support channel on the app’s App Store product page."]]
        ],
        footer: "© 2026 Duda Notes"
      },
      ko: {
        htmlLang: "ko",
        title: "개인정보 처리방침 · Duda Notes",
        skip: "본문으로 이동",
        eyebrow: "개인정보 처리방침",
        heading: "개인정보 처리방침",
        lede: "이 페이지는 Duda Notes가 데이터를 저장하고 사용하는 방식을 설명합니다.",
        updated: "업데이트: 2026년 8월 1일 · 버전 1.0 적용",
        tocTitle: "목차",
        promiseTitle: "간단히 말하면",
        promise: "메모와 첨부 파일은 기기에 저장됩니다. 앱에는 계정, 클라우드 동기화, 광고 또는 사용 분석 기능이 없으며 메모를 개발자에게 업로드하지 않습니다.",

          ["storage", "2. 기기에 저장되는 데이터", ["메모 기능을 제공하기 위해 앱은 다음 내용을 기기에 저장합니다:", ["메모, 폴더 및 텍스트 서식", "사용자가 직접 추가한 사진, 동영상 및 파일", "메모 기록, 알림 및 분류 정보", "테마, 사용자 지정 배경 및 기타 설정"], "이 내용은 앱의 로컬 저장 공간에 보관됩니다. 기기 백업에 포함되는지는 시스템 백업 설정에 따라 달라집니다."]],

          ["widget", "4. 홈 화면 위젯", ["위젯은 최근 메모의 제목, 일부 내용, 수정 시간 및 알림 상태를 기기에서 읽어 표시합니다. 잠금 상태에서 내용을 숨길지는 시스템 설정에 따라 달라집니다."]],

          ["collection", "6. 수집 및 추적", ["앱에는 계정, 개발자 서버, 광고 또는 제3자 분석 도구가 없습니다. 데이터를 수집하거나 판매하지 않으며 추적에 사용하지 않습니다."]],

          ["contact", "8. 문의", ["본 개인정보 처리방침에 관한 문의는 App Store 제품 페이지의 지원 채널을 이용해 주세요."]]
        ],
        footer: "© 2026 Duda Notes"
      }
    };

    const content = document.querySelector("#content");
    const footer = document.querySelector("#footer");
    const buttons = [...document.querySelectorAll("[data-lang]")];

    function paragraphs(items) {
      return items.map(item => Array.isArray(item)
        ? `<ul>${item.map(entry => `<li>${entry}</li>`).join("")}</ul>`
        : `<p>${item}</p>`).join("");
    }

    function render(language) {
      const policy = policies[language] || policies.zh;
      document.documentElement.lang = policy.htmlLang;
      document.title = policy.title;
      document.querySelector(".skip-link").textContent = policy.skip;
      document.querySelector('meta[name="description"]').content = policy.lede;
      document.querySelector('meta[property="og:title"]').content = policy.title;
      document.querySelector('meta[property="og:description"]').content = policy.lede;

      const links = policy.sections.map(([id, title]) =>
        `<a href="#${id}">${title.replace(/^\d+\.\s*/, "")}</a>`).join("");
      const sections = policy.sections.map(([id, title, body]) =>
        `<section id="${id}"><h2>${title}</h2>${paragraphs(body)}</section>`).join("");

      content.innerHTML = `
        <div data-lang-panel>
          <section class="hero">
            <p class="eyebrow">${policy.eyebrow}</p>
            <h1>${policy.heading}</h1>
            <p class="lede">${policy.lede}</p>
            <span class="date">${policy.updated}</span>
          </section>
          <div class="layout">
            <aside class="toc" aria-label="${policy.tocTitle}">
              <p class="toc-title">${policy.tocTitle}</p>
              ${links}
            </aside>
            <article>
              <div class="promise">
                <strong>${policy.promiseTitle}</strong>
                ${policy.promise}
              </div>
              ${sections}
            </article>
          </div>
        </div>`;
      footer.textContent = policy.footer;
      buttons.forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.lang === language));
      });
      try { localStorage.setItem("privacy-language", language); } catch (_) {}
    }

    buttons.forEach(button => button.addEventListener("click", () => render(button.dataset.lang)));

    let savedLanguage;
    try { savedLanguage = localStorage.getItem("privacy-language"); } catch (_) {}
    const browserLanguage = navigator.language.toLowerCase();
    const initialLanguage = savedLanguage && policies[savedLanguage]
      ? savedLanguage
      : browserLanguage.startsWith("ko") ? "ko"
      : browserLanguage.startsWith("en") ? "en"
      : "zh";
    render(initialLanguage);
  </script>
</body>
</html>
